logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG
    org.springframework.data.jdbc.repository.query: DEBUG
    sql: debug

spring:
  h2:
    console:
      enabled: true

  datasource:
    generate-unique-name: false
    name: blog
    url: jdbc:postgresql://postgres:5432/blog
    username: blogger
    password: blogger
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # This will create a table (event_publication) to persist the events published in the database
  modulith:
    events.jdbc-schema-initialization.enabled: true

  docker:
    compose:
      skip:
        in-tests: false
      enabled: true
      file: classpath:docker/docker-compose.yml
      lifecycle-management: start_only